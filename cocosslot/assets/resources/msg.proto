syntax = "proto3";
package netproto;

message HeartBeatConfig{
	 int32 BeatInterval=1;
	 int32 ConnLoseTimeSpan=2;
};



// 游客登录
message GuestLogin {
     string HDCode = 1;      // 设备码
     int32 HDType = 2;       // 设备类型
     int32 SiteID = 3;       // 渠道ID
     string Version = 4;     // 客户端版本号
     int32 PlatformID = 5;   // 平台号
     int32 ServerID = 6;     // 服务器ID
     string InviteCode = 7;  // 邀請碼
     string GuestKey = 8;    // check key
     int32 Area_ID = 9;      // 渠道ID
};

// 用户登录
message UserLogin {
     string HDCode = 1;     // 设备码
     int32 HDType = 2;      // 设备类型
     int32 SiteID = 3;      // 渠道ID
     string Version = 4;    // 客户端版本号
     int32 PlatformID = 5;  // 平台号
     string LoginName = 6;  // 用户名
     string Password = 7;   // 密码
     int32 UserID = 8;      // 用户ID
     string Cer = 9;        // 证书
     int32 Area_ID = 10;    // 渠道ID
};

// 用户登录结果
message UserLoginRet {
     int32 Code = 1;                  // 登录结果代码
     string Message = 2;              // 提示消息
     int32 UserID = 3;                // 用户ID
     string Cer = 4;                  // 用户证书
     string HDCode = 5;               // 设备码
     int32 HDType = 6;                // 设备类型
     UserHallLogonData UserData = 7;  // 用户数据
     int32 Area_ID = 8;               // 渠道ID
     FlowAmountInfo FlowInfo = 9;     // 充值返利活動
};

// 充值返利活動
message FlowAmountInfo {
     int32 Status = 1;           // 開關(1,0) (返利活動)
     int32 UnionPlatform = 2;    // 种类(如轰达或77) (返利活動)
     int32 FlowAmountNow = 3;    // 目前流水 (返利活動)
     int32 FlowAmountLimit = 4;  // 流水限制 (返利活動)
     int32 Achievement = 5;      // 是否達標 (返利活動)
     int32 FlowAmountRate = 6;   // 返利百分比 (返利活動)
     int32 BonusRate = 7;        // 兌換金額倍數 (返利活動)
     string CustomerDomain = 8;
}

// 用户大厅登录数据
message UserHallLogonData {
     string LoginName = 1;                // 用户名
     string NickName = 2;                 // 昵称
     int32 UserType = 3;                  // 用户类型
     int32 Sex = 4;                       // 用户性别
     int32 HeadID = 5;                    // 头像ID
     bool IsTopWindow = 6;                // 是否弹窗
     int64 CashAmount = 7;                // 当前现金数
     int64 BankAmount = 8;                // 当前银行数
     bool IsGaming = 9;                   // 是否游戏中
     string ServerAddr = 10;              // 服务器地址
     string ServerName = 11;              // 服务器名称
     bool IsKick = 12;                    // 是否踢人
     bool IsBindGuest = 13;               // 是否绑定游客
     int32 UserLevel = 14;                // 用户等级
     string LevelKey = 15;                // 等级校验字符串
     string AnnMsg = 16;                  // 弹出公告
     string ConvertRateTipMsg = 17;       // 兑换提示消息
     string BankPwdTipMsg = 18;           // 银行修改密码提示消息
     string UIFlag = 19;                  // UI预留标记
     string PaySort = 20;                 // 充值方式开关与顺序
     string UpGradeMsg = 21;              // 升级提示
     int32 LockGameID = 22;               // 是否在游戏中
     bool IsBindZhifubao = 23;            // 是否绑定支付宝
     string Zhifubao = 24;                // 支付宝账号
     string RealName = 25;                // 真实姓名
    repeated int32 GameList = 26;                 // 游戏列表
     string PayAmountConfig = 27;         // 充值金额配置
     string PayNotifyMsg = 28;            // 充值到账通知信息
     string NotifyFlag = 29;              // 通知标记0没有通知，1有通知  第1位表示是否有新邮件 后面位数备用
     string PayTips = 30;                 // 充值提示说明
     bool IsBindBankCard = 31;            // 是否绑定銀行卡
     string BankName = 32;                // 銀行名稱
     string BankCode = 33;                // 銀行代碼
     string BankCardNum = 34;             // 銀行卡號
     string BankRealName = 35;            // 銀行卡姓名
     string PayAmountRange = 36;          // 充值金額範圍配置
     string UISort = 37;                  // 充值分類排序
    repeated GameList2 GameList2 = 38;            // 游戏列表含狀態
    repeated Banner Banner = 39;                  // 廣告輪播圖
     int32 SumCharge = 40;                // 充值金額
     int32 ShowConvertLimit = 41;         // 顯示兌換的充值金額 (單位分)
     int32 ShowAllGameLimit = 42;         // 顯示所有遊戲充值金額 (單位分)
     string QuestionContactTip = 43;      // 詢問客服系統提示文字
     int32 AnnMsgShow = 44;               // 公告開關
     bool ClubOpen = 45;                  // 是否開啟代理
    repeated PaymentInfo PaymentInfoList = 46;    // 支付信息列表
     int32 ConvertBankShow = 47;          // 是否顯示兌換銀行顯示
     int32 ConvertAlipayShow = 48;        // 是否顯示兌換支付寶顯示
     int32 Area_ID = 49;                  // 渠道ID
     int64 ShowVIPAgent = 50;             // 多少金額可以顯示ＶＩＰ代理
     int32 ShopNameID = 51;               // 1=商城 2=支付
     int32 AgentNameID = 52;              // 1=代理支付 2=VIP
     int64 ShowCS = 53;                   // 顯示客服充值金額 (單位分)
     int32 PlaytimeCS = 54;               // 游戏多久显示客服
     int32 PlaytimeConvert = 55;          // 游戏多久显示兑换
     int32 PlaytimeVIPAgent = 56;         // 游戏多久显示充值代理
     int32 ShowConvertBindPhone = 57;     // 是否綁定手機顯示兌換
     int32 ShowAllGameBindPhone = 58;     // 是否綁定手機顯示所有遊戲
     int32 ShowVIPAgentBindPhone = 59;    // 是否綁定手機顯VIP代理
     int32 ShowCSBindPhone = 60;          // 否綁定手機顯示客服
     int32 ShowConvertPopup = 61;         // 是否強制顯示兌換按鈕
     string ConvertPopupText = 62;        // 強制顯示兌換按鈕時的訊息內容
     int64 CouponAmount = 63;             // 当前礼码数
     int32 AvatarFrame = 64;              // VIP 頭像框 ID
     int32 GiftMoney = 65;                // 綁定送金幣
     int32 ShowCampaignAtLogin = 66;      // 回傳登入彈跳活動視窗
     int32 ShowFirstDepositAtLogin = 67;  // 是否在登入時彈跳首充返利活動視窗
};

// 支付信息
message PaymentInfo {
     int32 GWID = 1;
     int32 TypeID = 2;
     string TypeName = 3;
     string AmountSort = 4;
     int32 Area_ID = 5;  // 渠道ID
}

// 廣告輪播圖
message Banner {
     string Picture = 1;
     string Link = 2;
     int32 Behavior = 3;
     int32 Area_ID = 4;  // 渠道ID
}

// 游戏列表含狀態
message GameList2 {
     int32 GameID = 1;
     int32 Popular = 2;
     string IconName = 3;
     string AliasName = 4;
     string IconTitle = 5;
     string Skin = 6;
     int32 Area_ID = 7;  // 渠道ID
}

// 用户登出
message UserLogout {
     int32 UserID = 1;   // 用户ID
     string Cer = 2;     // 证书
     int32 Area_ID = 3;  // 渠道ID
};

// 平台版本信息
message HallVerReq {
     int32 Area_ID = 1;  // 渠道ID
};

// 注意版本号字符串可能为空。这时服务器可能是在出错的情况下。 客户端应该提示错误并退出
message HallVerInfo {
     string AndroidVersion = 1;
     string IOSVersion = 2;
     string UpdateDomain = 3;
     string BillDomain = 4;
     string ClubDomain = 5;
     string CustomerDomain = 6;
     string AreaConfig = 7;
     int32 Area_ID = 8;  // 渠道ID
     string AndroidVersion2 = 9;
     string IOSVersion2 = 10;
};

// 所有服务器信息
message AllGameServerInfo {
    repeated GameServerInfo ServerList = 1;
     int32 Area_ID = 2;  // 渠道ID
};

// 游戏服务器列表
message GameServerInfo {
     int32 GameID = 1;           //游戏ID
     string GameName = 2;        //游戏名称
     int32 LoginMoney = 3;       //入场金币数
     string Flag = 4;            //标记
     string Status = 5;          //状态
     int32 BaseScore = 6;        //底分
     int32 Single = 7;           //直接進入取第一個服務器進入, 0=>顯示房間列表, 1=>第一個服務器進入
     string AndroidVersion = 8;  // 客戶端版本號
     string IOSVersion = 9;      // 客戶端版本號
     int32 KickOutMoney = 10;    //入场金币数
     int32 MaxOdd = 11;          // 最高倍數
     int32 GameType = 12;        //遊戲類型: 1.真錢 2.比賽 3.休閒
     int32 Area_ID = 13;         // 渠道ID
     int32 Port = 14;
     int32 ServerID = 15;
     string IPAddress = 16;
};

// 请求游戏服务器地址
message RequestGameServerAddrInfo {
     string ServerFlag = 1;  //服务器标记
     int32 GameID = 2;       //游戏ID
     int32 Area_ID = 3;      // 渠道ID
};

// 游戏服务器地址信息
message GameServerAddr {
     int32 ServerID = 1;    //服务器ID
     string IPAddress = 2;  //服务器地址
     int32 Port = 3;        //服务器端口
     int32 Area_ID = 4;     // 渠道ID
     int32 StatusID = 5;    // 0正常, 1異常重連
};

// 绑定支付宝
message ZhifubaoInfo {
     string Zhifubao = 1;  //支付宝
     string RealName = 2;  //实名
     string VCode = 3;     //验证码
     int32 CodeType = 4;   //验证码类型, 4綁定, 5變更
     int32 Area_ID = 5;    // 渠道ID
};

// 绑定銀行卡
message BankCardInfo {
     string BankCardNum = 1;  //銀行卡號
     string RealName = 2;     //实名
     string BankCode = 3;     //銀行代碼
     string VCode = 4;        //验证码
     int32 CodeType = 5;      //验证码类型, 4綁定, 5變更
     int32 Area_ID = 6;       // 渠道ID
};

// 修改密码
message ModifyPassword {
     string OldPwd = 1;       //旧密码
     string NewPassword = 2;  //新密码
     int32 Area_ID = 3;       // 渠道ID
};

// 发送验证码
message SendPhoneVCode {
     string Tel = 1;      //用户手机号码
     int32 CodeType = 2;  //验证码类型	 1 注册 2 找回密码 3 找回银行密码 4 綁定兌換帳號資訊 5 變更兌換帳號資訊
     int32 Area_ID = 3;   // 渠道ID
};
// 发送验证码结果
message SendPhoneVCodeRet {
     int32 Code = 1;
     string Message = 2;
     int32 CountDown = 3;
     int32 CodeID = 4;
     int32 Area_ID = 5;  // 渠道ID
};

// 修改头像
message ModifyFace {
     int32 FaceID = 1;
     int32 Area_ID = 2;  // 渠道ID
};

// 存取款
message MoneyDeposit {
     int64 Amount = 1;
     string MoneyPassword = 2;
     int32 OP = 3;       // 0 存款 1 取款
     int32 Area_ID = 4;  // 渠道ID
};

// 存取款结果
message MoneyDepositRet {
     int64 Amount = 1;
     int32 OP = 2;  // 0 存款 1 取款
     int32 Code = 3;
     string Message = 4;
     int64 CurrentMoney = 5;
     int64 CurrentBank = 6;
     int32 Area_ID = 7;  // 渠道ID
};

// 绑定游客账号
message BindGuestAccount {
     string Tel = 1;       // 手机号码
     string VCode = 2;     // 验证码
     string Password = 3;  // 密码
     int32 Area_ID = 4;    // 渠道ID
};

// 请求用户大厅信息
message RequestUserHallInfo {
     int32 SiteID = 1;   // 渠道ID
     int32 Area_ID = 2;  // 渠道ID
};

// 找回账号密码信息
message FindSetPwdByPhone {
     string Tel = 1;       // 手机号码
     string VCode = 2;     // 验证码
     string Password = 3;  // 密码
     int32 Area_ID = 4;    // 渠道ID
};

// 修改银行密码
message ModifyBankPassword {
     string OldPwd = 1;       // 旧密码
     string NewPassword = 2;  // 新密码
     int32 Area_ID = 3;       // 渠道ID
};

// 找回银行密码信息
message FindSetBankPwdByPhone {
     string VCode = 1;     // 验证码
     string Password = 2;  // 密码
     int32 Area_ID = 3;    // 渠道ID
};

//邮件详情
message MailDetail {
     int32 ID = 1;         //邮件ID
     string Title = 2;     //邮件标题
     string Content = 3;   //邮件内容
     bool IsRead = 4;      //是否已读
     string SendTime = 5;  //发送时间
     int32 Area_ID = 6;    // 渠道ID
};

//获取邮件列表
message MailList {
    repeated MailDetail MailList = 1;  // 邮件列表
     int32 Area_ID = 2;        // 渠道ID
};

// 获取邮件详情
message RequestMailDetail {
     int32 ID = 1;       // 邮件ID
     int32 Area_ID = 2;  // 渠道ID
};

// 发送联系客服问题
message ContactService {
     string Msg = 1;
     int32 QuestionType = 2;  // 0無分類, 1無法登錄, 2帳號異常, 3其他
     int32 PlatformID = 3;
     int32 Area_ID = 4;  // 渠道ID
};

// 代理详情
message AgentDeatil {
     string Name = 1;     // 代理名称
     string WXNo = 2;     // 徽信号
     string QQ = 3;       // QQ号
     string Alipay = 4;   // Alipay号
     string Jiuliao = 5;  // 久聊
     int32 Area_ID = 6;   // 渠道ID
};

// 代理列表
message AgentList {
    repeated AgentDeatil AgentList = 1;  // 代理列表
     int32 Area_ID = 2;          // 渠道ID
};

// 举报代理信息
message ReportAgent {
     string AgentName = 1;  // 代理名称
     string Content = 2;    // 举报内容
     int32 Area_ID = 3;     // 渠道ID
};

// 请求代理信息
message RequestAgentList {
     int32 Area_ID = 1;  // 渠道ID
};

// 代理招商
message ApplyAgent {
     string Name = 1;    // 姓名
     string Tel = 2;     // 电话
     string QQ = 3;      // QQ号码
     string WXNo = 4;    // WX号
     string Memo = 5;    // 说明
     string Alipay = 6;  // Alipay
     int32 Area_ID = 7;  // 渠道ID
};

// 兑换金币信息
message ConvertMoney {
     int64 Amount = 1;       // 兑换数量,单位分
     int32 ConvertType = 2;  // 兌換方式,1.支付寶 2.銀行卡
     int32 Area_ID = 3;      // 渠道ID
};

// 创建充值订单请求信息
message CreatePayOrder {
     int32 PayTypeID = 1;  // 充值类型 1.支付宝 2.微信 3.银联 4.QQ钱包
     int64 Amount = 2;     // 充值数量,单位分
     int32 Area_ID = 3;    // 渠道ID
};

// 创建充值订单返回信息
message CreatePayOrderRet {
     int32 code = 1;      // 订单创建结果
     string message = 2;  // 返回消息
     int32 OrderID = 3;   // 订单编号
     int32 Area_ID = 4;   // 渠道ID
};

// 获取FAQ信息
message GetFAQ {
     int32 PlatformID = 1;  // 平台ID
     int32 Area_ID = 2;     // 渠道ID
};

// FAQ信息
message FAQDetail {
     string Content = 1;  // FAQ内容
     int32 Area_ID = 2;   // 渠道ID
};

// 查詢兌換記錄
message GetConvertLog {
     int32 TnyStatus = 1;  // 狀態
                                   // {0:"兑换完成",1:"审核中",2:"审核通过",3:"已打款",4:"订单异常",5:"异常帐号",6:"黑名单",7:"账户错误",8:"拒绝兑换",9:"疑似洗钱",10:"补单完成
                                   // ",11:"退还金币",99:"全部"};
     int32 LogRange = 2;  // 1(一周),2(半個月),3(一個月),4(三個月)
     int32 Area_ID = 3;   // 渠道ID
}

// 兌換記錄
message ConvertLogDetail {
     int64 Amount = 1;       // 兌換金額,單位分
     int64 TaxAmount = 2;    // 手續費,單位分
     int32 Status = 3;       // 狀態
     string Payment = 4;     // 收款方式
     string CreateTime = 5;  // 兌換時間
     int32 Area_ID = 6;      // 渠道ID
}

// 兌換記錄列表
message ConvertLogList {
    repeated ConvertLogDetail ConvertLogList = 1;  // 兌換記錄列表
     int32 Area_ID = 2;                    // 渠道ID
}

// 銀行資訊
message BankDetail {
     string BankCode = 1;  // 銀行代碼
     string BankName = 2;  // 銀行名稱
     int32 Area_ID = 3;    // 渠道ID
}

// 銀行資訊列表
message BankList {
    repeated BankDetail BankList = 1;  // 銀行資訊列表
     int32 Area_ID = 2;        // 渠道ID
}

// 登入獎勵
message LoginBonusData {
     int32 LoginTimes = 1;     // 己領取次數
     int32 RetCode = 2;        // 領取代碼 0 本日己領取, 1 成功領取, 2可領取, -1 活動不存在, -2
                                       // 已領超過七次限制, -3 充值金額不足, -4 帳號未綁定
     string RetMsg = 3;        // 領取訊息
     int64 CurrentAmount = 4;  // 領取後用戶金幣數量
     int64 GiftCash = 5;       // 最低充值金額
     int32 Area_ID = 6;        // 渠道ID
    repeated int32 BonusDayData = 7;   //每日獎勵Array
}

// 取得代理資訊
message AgentData {
     int32 UserID = 1;                     // 用戶ID
     int32 RetCode = 2;                    // 返回消息 0 代理, -1 非代理
     AgentDetailData AgentDetailData = 3;  // 代理詳細資訊
    repeated AgentDownSteam DownSteamList = 4;     // 代理下線資訊
     int32 Area_ID = 5;                    // 渠道ID
}

// 代理詳細資訊
message AgentDetailData {
     int32 UserID = 1;          // 用戶ID
     int32 Class = 2;           // 階級( 0 系統管理者 1 一級代理  2 二級代理 99 一般玩家  100 渠道代理)
     int32 Status = 3;          // 狀態( 0 關閉; 1 開啟 2 審核中)
     int32 Level = 4;           // 等級( 1 王者 2 黃金 3 鑽石)
     string InviteCode = 5;     // 代理邀請碼
     int32 ParentUserID = 6;    // 上級代理ID
     int32 TotalFlows = 7;      // 總流水
     int32 TotalIncome = 8;     // 總收入
     int32 RemainAmount = 9;    // 提領後剩餘可提領金額
     int32 CanBeAgent = 10;     // 是否可成為代理 0不行 1可以
     string OfficeUser1 = 11;   // 1號諮詢專員
     string ParentWeixin = 12;  // 上級的微信號
     string DownloadURL = 13;   // 上級的URL
     int32 CurrentIncome = 14;  // 總收入
     string OfficeUser2 = 15;   // 2號諮詢專員
     string OfficeUser3 = 16;   // 3號諮詢專員
     string QRUrl = 17;         // 二維碼地址
     int32 User1Type = 18;      // 客服代理類別1
     int32 User2Type = 19;      // 客服代理類別2
     int32 User3Type = 20;      // 客服代理類別3
     int32 Area_ID = 21;        // 渠道ID
}

// 代理下線資訊
message AgentDownSteam {
     int32 UserID = 1;     // 用戶ID
     int32 Yesterday = 2;  // 昨日流水
     int32 Today = 3;      // 今日流水
     int32 Area_ID = 4;    // 渠道ID
}

// 申請代理下線
message JoinAgentList {
     int32 UserID = 1;       // 用戶ID
     string InviteCode = 2;  // 邀請碼
     int32 RetCode = 3;      // 返回消息 1 成功, -1 失敗(邀請碼錯誤或是代理已綁定)
     string RetMsg = 4;      // 結果狀態
     int32 Area_ID = 5;      // 渠道ID
}

// 申請成為代理
message ApplyAgentList {
     int32 UserID = 1;   // 用戶ID
     int32 RetCode = 2;  // 返回消息 1 成功, -1 失敗(邀請碼錯誤或是代理已綁定)
     string RetMsg = 3;  // 結果狀態
     int32 Area_ID = 4;  // 渠道ID
}

// 未讀客服消息數量
message CSNotiftyCount {
     int32 UserID = 1;   // 用戶ID
     int32 Count = 2;    // 未讀數量
     int32 Area_ID = 3;  // 渠道ID
}

// 申請成為代理
message RequestApplyAgent {
     int32 UserID = 1;   // 用戶ID
     string Tel = 2;     // 用戶電話
     string Weixin = 3;  // 用戶微信
     string QQ = 4;      // 用戶QQ號
     string Email = 5;   // 用戶信箱
     string VCode = 6;   // 邀請碼
     int32 Area_ID = 7;  // 渠道ID
}

// 代理訪問資料傳遞
message ProxyData {
     string data = 1;
     string type = 2;
     int32 Area_ID = 3;  // 渠道ID
}

// 代理訪問POST資料傳遞
message ProxyPOSTData {
     string Url = 1;
     string HtmlData = 2;
     int32 Area_ID = 3;  // 渠道ID
     string type = 4;
}

// 查詢比賽活動公告
message GetGameCompetitionMsg {
     int32 GameID = 1;
     int32 FlagID = 2;
     int32 UserID = 3;
     int32 Area_ID = 4;  // 渠道ID
}

// 回傳比賽活動公告
message GameCompetitionMsg {
    repeated LeaderboardDetail Leaderboard = 1;  // 排行榜
     int32 UserID = 2;
     int32 BestScore = 3;    // 最好的一次分數
     int32 FreeTimes = 4;    // 免費次數
     int32 UserRanking = 5;  // 目前排名
    repeated string MsgInfo = 6;     // 公告訊息
     int32 Charge = 7;       // 入場費
     int32 PiSaiTime = 8;    // 比賽剩餘時間
     int32 Area_ID = 9;      // 渠道ID
}

// 排行榜
message LeaderboardDetail {
     string TitleName = 1;                // 頁籤名稱
    repeated ScoreboardList LeaderboardList = 2;  // 分數排名詳細資料
     int32 Area_ID = 3;                   // 渠道ID
}

// 分數排名詳細資料
message ScoreboardList {
     int32 SortID = 1;  // 排名
     string UserID = 2;
     int32 Score = 3;    // 比賽分數
     int32 Area_ID = 4;  // 渠道ID
}

// 查詢比賽規則 GetGameCompetitionMsg
message GetGameCompetitionRuleMsg {
     int32 GameID = 1;
     int32 Area_ID = 2;  // 渠道ID
}

// 回傳比賽規則
message GameCompetitionRuleMsg {
     int32 Charge = 1;                // 入場費用
     int32 PlayTime = 2;              // 限定的時間(s)
     int32 Coin = 3;                  // 固定比賽幣
    repeated OrderTicketMsg OrderTicket = 4;  // 充值金額對應免費次數
    repeated RewardDetail RewardInfo = 5;     // 每日和每周獎勵與時間
     string StartTime = 6;            // 開始時間
     string EndTime = 7;              // 結束時間
     int32 Show = 8;                  // 0關閉 1顯示
     string EnterTime = 9;            // 最後進入時間
     int32 ContestID = 10;            // 比賽活動ID
     int32 Area_ID = 11;              // 渠道ID
}

// 每日和每周獎勵與時間
message RewardDetail {
     int32 Type = 1;       // 1每日 2每周
    repeated int32 Bonus = 2;      // 排名的獎勵
     string DeadLine = 3;  // 截止時間
     int32 Area_ID = 4;    // 渠道ID
}

// 充值金額對應免費次數
message OrderTicketMsg {
     int32 ID = 1;          // id
     int32 OrderReach = 2;  // 充值金額
     int32 FreeTicket = 3;  // 免費次數
     int32 Area_ID = 4;     // 渠道ID
}

// 更新推播序號
message ClientUpdateUserNotifyIdx {  // 客戶端用
     int64 Idx = 1;
     int32 Area_ID = 2;  // 渠道ID
}

// 查詢買票入場
message GetBuyTicketMsg {
     int32 GameID = 1;
     int32 FlagID = 2;
     int32 UserID = 3;
     int32 Area_ID = 4;  // 渠道ID
}

// 回傳買票入場
message BuyTicketMsg {
     int32 RetCode = 2;  // 返回消息 1 成功, -1 失敗(邀請碼錯誤或是代理已綁定)
     string RetMsg = 3;  // 結果狀態
     int32 Area_ID = 4;  // 渠道ID
}

// 回傳獎金池
