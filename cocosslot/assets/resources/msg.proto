message FirstDepositGetInfoMsg {
     int32 Area_ID = 1;  // 渠道ID
     int32 UserID = 2;   // 玩家編號
}

// 回傳 取得首充返利活動與該用戶相關資料
message FirstDepositGetInfoRetMsg {
     int32 RetCode = 1;
     FirstDepositInfo FirstDepositInfo = 2;              // 首充返利活動資料
     FirstDepositUserRecord FirstDepositUserRecord = 3;  // 首充返利活動該用戶相關資料
}

// 首充返利活動資料
message FirstDepositInfo {
     string StartTime = 1;        // 活動開始時間
     string EndTime = 2;          // 活動結束時間
     int64 DepositLimit = 3;      // 單筆充值限制 (單位:分)
     int64 WinAmount = 4;         // 需贏得金額 (單位:分)
     int64 ReturnAmount = 5;      // 返利金額 (單位:分)
     int32 Status = 6;            // 0:關閉，1:開啟
     int32 CurrentUserCount = 7;  // 目前玩家數
}

// 首充返利活動該用戶相關資料
message FirstDepositUserRecord {
     int32 UserID = 1;         // 玩家編號
     int64 EventID = 2;        // 對應Table 1的ID
     string JoinTime = 3;      // 加入本次活動時間，即單筆充值達到標準的時間
     int64 DepositAmount = 4;  // 該次充值金額
     int64 WinAmount = 5;      // 累計贏得金額
     int32 Flag = 6;           // 領取狀態(0:未領取, 1:已領取)
     string CollectTime = 7;   // 領取時間
     int64 CollectAmount = 8;  // 領取金額
     int32 UserType = 9;       // 用戶帳號身分(1: 正式帳號, 3: 遊客帳號(不能領)
}

// 請求 領取首充返利回饋金
message FirstDepositCollectMsg {
     int32 Area_ID = 1;     // 渠道ID
     int32 UserID = 2;      // 玩家編號
     int64 EventID = 3;     // 對應Table 1的ID
     string IPAddress = 4;  // 玩家IP
}

// 回傳 領取首充返利回饋金
message FirstDepositCollectRetMsg {
     int32 RetCode = 1;
     string RetMessage = 2;
}