<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">

    <title>target Game</title>

    <!--http://example.invalid/en/mobile/mobifying/-->
    <meta name="viewport"
          content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1"/>

    <!--https://example.invalid/library/safari/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html-->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">

    <!-- force webkit on 360 -->
    <meta name="renderer" content="webkit"/>
    <meta name="force-rendering" content="webkit"/>
    <!-- force edge on IE -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="msapplication-tap-highlight" content="no">

    <!-- force full screen on some browser -->
    <meta name="full-screen" content="yes"/>
    <meta name="x5-fullscreen" content="true"/>
    <meta name="360-fullscreen" content="true"/>

    <!-- force screen orientation on some browser -->
    <meta name="screen-orientation" content="landscape"/>
    <meta name="x5-orientation" content="landscape">

    <!--fix fireball/issues/3568 -->
    <!--<meta name="browsermode" content="application">-->
    <meta name="x5-page-mode" content="app">

    <!--<link rel="apple-touch-icon" href=".png" />-->
    <!--<link rel="apple-touch-icon-precomposed" href=".png" />-->

    <!--<link rel="stylesheet" type="text/css" href="style-mobile.css"/>-->
    <style>html {
        -ms-touch-action: none;
    }

    body, canvas, div {
        display: block;
        outline: none;
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0);

        user-select: none;
        -moz-user-select: none;
        -webkit-user-select: none;
        -ms-user-select: none;
        -khtml-user-select: none;
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    }

    /* Remove spin of input type number */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
        /* display: none; <- Crashes Chrome on hover */
        -webkit-appearance: none;
        margin: 0; /* <-- Apparently some margin are still there even though it's hidden */
    }

    body {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        padding: 0;
        border: 0;
        margin: 0;

        cursor: default;
        color: #888;
        background-color: #000000;

        text-align: center;
        font-family: Helvetica, Verdana, Arial, sans-serif;

        display: flex;
        flex-direction: column;

        /* fix bug: https://example.invalid/cocos-creator/2d-tasks/issues/791 */
        /* overflow cannot be applied in Cocos2dGameContainer, 
        otherwise child elements will be hidden when Cocos2dGameContainer rotated 90 deg */
        overflow: hidden;
    }

    #Cocos2dGameContainer {
        position: absolute;
        margin: 0;
        left: 0px;
        top: 0px;

        display: -webkit-box;
        -webkit-box-orient: horizontal;
        -webkit-box-align: center;
        -webkit-box-pack: center;
    }

    canvas {
        background-color: rgba(0, 0, 0, 0);
    }

    a:link, a:visited {
        color: #666;
    }

    a:active, a:hover {
        color: #666;
    }

    p.header {
        font-size: small;
    }

    p.footer {
        font-size: x-small;
    }

	#splash {
		position: absolute;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		background: #171717 url(./../../black.png) no-repeat center;
		background-size: cover;
		background-color: #000000;
		background-position: center center;
		background-repeat: no-repeat;
	}

	#loading {
		position: absolute;
		top: 85%;		
		left: calc(50% - 80px);
		width: 160px;
		height: 34px;
		background: #171717 url(./../../loading.png);
		background-color: #00000000;
	}

    .progress-bar {
        position: absolute;
        left: 27.5%;
        top: 80%;
        height: 3px;
        padding: 2px;
        width: 45%;
        border-radius: 7px;
        box-shadow: 0 1px 5px #000 inset, 0 1px 0 #444;
    }

    .progress-bar span {
        display: block;
        height: 100%;
        border-radius: 3px;
        transition: width .4s ease-in-out;
        background-color: #3dc5de;
    }

    .stripes span {
        background-size: 30px 30px;
        background-image: linear-gradient(135deg, rgba(255, 255, 255, .15) 25%, transparent 25%,
        transparent 50%, rgba(255, 255, 255, .15) 50%, rgba(255, 255, 255, .15) 75%,
        transparent 75%, transparent);

        animation: animate-stripes 1s linear infinite;
    }

    @keyframes animate-stripes {
        0% {
            background-position: 0 0;
        }
        100% {
            background-position: 60px 0;
        }
    }
    </style>
    <link rel="icon" href="favicon.ico"/>
</head>
<body>
<canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
<div id="splash">
    <!--
    <div class="progress-bar stripes">
      <span style="width: 0%"></span>
    </div>
    -->
    <div id="loading"></div>
</div>
<script src="src/settings.js" charset="utf-8"></script>
<script src="main.js" charset="utf-8"></script>
<script src="../../js/logoPic.js" charset="utf-8"></script>
<script type="text/javascript">
    (function () {
        // open web debugger console
        if (typeof VConsole !== 'undefined') {
            window.vConsole=new VConsole();
        }

        let splash=document.getElementById('splash');
        splash.style.display='block';
		/*
        let rot = document.createElement("rotate");
        rot.src = "../../js/rotate.js?v=" + (new Date()).getTime();
        document.body.appendChild(rot);
        */
		var loading=document.getElementById('loading');
		if (loading){
			loading.style.display='none';
		}

        let cocos2d=document.createElement('script');
        cocos2d.async=true;
        cocos2d.src=window._CCSettings.debug ? 'cocos2d-js.js' : 'cocos2d-js-min.f9c7d.js';

        let engineLoaded=function () {
            document.body.removeChild(cocos2d);
            cocos2d.removeEventListener('load', engineLoaded, false);
            window.boot();
            
			var script = document.createElement("script");
			script.src = "../../js/target.js?v=" + (new Date()).getTime();
			document.body.appendChild(script);
        };
        //開始遊戲引擎的運作在這邊：
        cocos2d.addEventListener('load', engineLoaded, false);

        let script = document.createElement("script");
		script.type = 'text/javascript';			
		script.src = "../../js/logo.js?v=" + (new Date()).getTime();
		script.onload = function () {
			window.initLogo(false, "url('../../bg01.png')", function(){
				document.body.appendChild(cocos2d);
			})
		}
		document.body.appendChild(script);
    })();
</script>
</body>
</html>
