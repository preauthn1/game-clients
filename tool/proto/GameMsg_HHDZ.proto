syntax = "proto3";

package GameMsg_HHDZ;

//下注设置
message HHDZ_Setting {
    repeated int32 BetCount = 1;     //一次下注的数量
     int32 BetMoney = 2;     //一次下注的钱
     int64 ZhuangLimit = 3;  //上庄钱限制
	 int64 betlimitmoney = 4;//下注攜帶金額限制
    repeated int64 BetMax = 5;         //下注上限
};

//状态消息
message HHDZ_Sate {
     int32 State = 1;  //状态
     int32 Time = 2;   //此状态的剩余时间
};

//用户断线重连下注消息
message HHDZ_UserBetInfo {
     int64 UserMoney = 1;
    repeated HHDZ_BroadCastBet BetInfo = 2;
};

//广播用户下注的数组
message HHDZ_BroadCastBetArr {
     int32 UserID = 1;
    repeated HHDZ_BroadCastBet BroadCastBetArr = 2;
};

//广播用户下注内容数据结构
message HHDZ_BroadCastBet {
     int32 Type = 1;
     int64 Money = 2;
     bool LuckyStar = 3;
};

//用户下注数组
message HHDZ_BetArr {
    repeated HHDZ_Bet BetArr = 1;
};

//用户下注数据结构
message HHDZ_Bet {
     int32 BetType = 1;
     int32 Count = 2;
};

//下注的结果
message HHDZ_BetRet {
     int32 Ret = 1;  // 0下注成功，-1用户金额不足，-2下注的类型未找到，-3庄家不能下注，-4此类下注已达到上限，-5不可同时下注龙与虎，-6用户金额小於下注限制
     int64 Money = 2;      //用户的钱，下注以后的金额。
     int32 Type = 3;       //下注超过限制的下注类型
    repeated HHDZ_Bet BetArr = 4;  //用户下注数据
}

//游戏用户赢钱结果
message HHDZ_GameResultUserMoney {
     int64 ZhuangWin = 1;
     int64 SelfWin = 2;
    repeated HHDZ_WinUerInfo WinUserInfo = 3;     //赢钱前三名的人信息
    repeated HHDZ_StageUerInfo StageUerInfo = 4;  //標誌玩家赢钱信息
};
//赢钱玩家信息
message HHDZ_WinUerInfo {
     string UserName = 1;
     int64 Win = 2;
};
//標誌玩家赢钱信息
message HHDZ_StageUerInfo {
     int32 UserID = 1;
     int64 Win = 2;
};

message HHDZ_Cards {
    repeated HHDZ_Poker Cards = 1;
     int32 RoundID = 2;  //局數
};

//上庄结果
message HHDZ_ShangzhuangRet {
     int32 ret = 1;  //值为1时下庄成功，值为0表示上庄成功，值为-1时上庄失败资金不足，值为-2时已经在上庄列表中。
};

//是否上庄
message HHDZ_ShangZhuang {
     bool IsShangZhuang = 1;
};

//庄家信息
message HHDZ_ZhuangInfo {
     int32 UserID = 1;
     int32 LastTurn = 2;
    repeated GameUser UserInfo = 3;
};

//上庄列表
message HHDZ_ZhuangList {
    repeated GameUser UserInfo = 1;
};
//清除结果回应消息
message HHDZ_BetClearRet {
     int64 Money = 1;  //当前的钱
     int32 Ret = 2;    //清除结果-1，清理失败，达到清理上限，0清理成功
};

//大富豪列表消息
message HHDZ_RichestList {
    repeated HHDZ_Richest RichestList = 1;  //富豪的排行榜
};

//大富豪的玩家資訊
message HHDZ_Richest {
     int32 Ranking = 1;        //富豪排名
     int32 UserID = 2;         //富豪ID
     int32 UserFaceID = 3;     //富豪頭像ID
     int64 Money = 4;          //富豪当前身上的钱
     int32 AvatarFrameID = 5;  // VIP頭框像ID
};

//幸運星玩家消息
message HHDZ_LuckyStarList {
    repeated HHDZ_LuckyStar LuckyStarList = 1;  //幸運星玩家資訊
};

//幸運星玩家資訊
message HHDZ_LuckyStar {
     int32 UserID = 1;         //幸運星ID
     int32 UserFaceID = 2;     //幸運星頭像ID
     int32 AvatarFrameID = 3;  // VIP頭框像ID
};

//本局局數
message HHDZ_RoundID {
     int32 HungWin = 1;  //紅贏局數
     int32 HeiWin = 2;   //黑贏局數
     int32 RoundID = 3;  //局數
};

//第一次發兩張牌
message HHDZ_FapaiFirstCards {
    repeated HHDZ_Poker HungPoker = 1;  //紅區扑克牌
    repeated HHDZ_Poker HeiPoker = 2;   //黑區扑克牌
};


message Http_HHDZ_GameInfo {
    repeated Http_HHDZ_TableList TableList = 1;  //桌子信息
};

message Http_HHDZ_TableList {
     int32 TableNo = 1;            //桌子号
     int32 Status = 2;             //当前状态 0 下注中 1 开奖中 2开奖动画 3结算动画 4等待开始游戏
     int32 GameUserCount = 3;      //玩家人数(包含未下注玩家)
     int32 RobotCount = 4;         //机器人数(包含未下注机器人)
     int64 SumEarnAmount = 5;      //系统从开服到现在的总收益
     int32 LastEarnAmount = 6;     //最后一局收益
     int64 PoolCurrentAmount = 7;  //当前水池金币数
     int64 SysTaxIncome = 8;       //系統稅收
};

message Http_HHDZ_BetBlackDetail {
     string BlackUserList = 1;  //黑名單UserId
};

message Http_HHDZ_TableDetail {
     int32 TableNo = 1;            //桌子号
     int32 Status = 2;             //当前状态 0 下注中 1 开奖中 2开奖动画 3结算动画 4等待开始游戏
     int64 SumEarnAmount = 3;      //系统从开服到现在的总收益
     int32 LastEarnAmount = 4;     //最后一局收益
     int64 PoolCurrentAmount = 5;  //当前水池金币数
     int32 GameUserCount = 6;      //游戏玩家人数(包含未下注玩家)
     int32 RobotCount = 7;         //机器人数(包含未下注机器人)
     int32 PopWaterRate = 8;       //当前注水率

     int32 ZhuangType = 9;                 //庄家类型	0系统 1机器人当庄 2玩家上庄
     string ZhuangNickName = 10;           //庄家昵称
     int32 ZhuangUserID = 11;              //庄家用户ID
     int32 ZhuangSurplusTotal = 12;        //庄家剩余局数
     int64 ZhuangCurrentMoneyAmount = 13;  //庄家当前金币数 系统或机器人坐庄则表示水池金币数量
     int64 ZhuangInitMoneyAmount = 14;     //庄家初始上庄金币数 系统或机器人坐庄则用0表示

     int64 OpenResultHung = 15;  //当前开奖结果为紅的收益数量
     int64 OpenResultHei = 16;   //当前开奖结果为黑的收益数量

     string CurentOpenResult = 17;     //当前开奖结果,只有在开奖动画状态下有值
     int64 CurentOpenResultEarn = 18;  //当前开奖收益,只有在开奖动画状态下有值

    repeated Http_HHDZ_UserInfo UserInfo = 19;  //玩家信息
     int64 SysTaxIncome = 20;           //系統稅收
     int32 BetTime = 21;                //下注時間

     int64 WinLine = 22;                       //平衡金額
     int64 RobotBetAmount = 23;                //機器人下注量
    repeated Http_HHDZ_UserInfo LastGameUserBet = 24;  //上局下注玩家信息
     int32 HungWinRate = 25;
     int32 PowerWinRate = 26;
     int32 HeiWinRate = 27;
     int64 FanFengTarget = 28;
     int64 FanFengComplete = 29;
};

message Http_HHDZ_UserInfo {
     int32 UserID = 1;        //玩家ID
     int32 UserType = 2;      //玩家类型 0机器人 1玩家
     string NickName = 3;     //玩家昵称
     int64 GameScore = 4;     //游戏总输赢
     int64 InitMoney = 5;     //初始金币
     int64 CurrentMoney = 6;  //当前金币
     int64 BetInfoHung = 7;   //下注紅的金币数量
     int64 BetInfoHei = 8;    //下注黑的金币数量
     int64 BetInfoPower = 9;  //下注致命一擊的金币数量
     int64 SumCharge = 10;    //總充值
     int64 SumConvert = 11;   //總兌換
     int64 WinRate = 13;      // 9局勝率
     int64 BetTotal = 14;
     bool IsVIP = 15;
};

//前20次开出的牌
message HHDZ_ResultCardList {
    repeated HHDZ_GameResultPoker CardList = 1;
};

//游戏扑克结果
message HHDZ_GameResultPoker {
    repeated HHDZ_Poker HungPoker = 1;  //紅區扑克牌
    repeated HHDZ_Poker HeiPoker = 2;   //黑區扑克牌
     int32 HungZuHe = 3;        //紅的组合结果
     int32 HeiZuHe = 4;         //黑的组合结果
     int32 Win = 5;             //贏家，1:紅，2:黑
     int32 RoundID = 6;         //局數
};

//牌的点数和花色
message HHDZ_Poker {
     int32 Color = 1;   //从0-3，分别表示方块，梅花，红桃，黑桃
     int32 Number = 2;  //数字1-13，A-K
};

message GameUser {
    required int32 UserID = 1;
    required string NickName = 2;
    required int32 Sex = 3;
    required int32 FaceID = 4;
    required int64 Score = 5;
    required int32 WinCount = 6;
    required int32 LoseCount = 7;
    required int32 DrawCount = 8;
    required int32 StateValue = 9;
    required int32 TableNo = 10;
    required int32 SeatNo = 11;
    optional int32 LastWinLose = 12;
};