syntax = "proto3";

package GameMsg_TGW;

// [訊息] 遊戲初始時所需資訊 Server to Client -> TGW_SettingID = 10001
message TGW_MSG_Setting {
     int32 PayLineMode = 1;                  // 賠付線類型 (0.非全線, 1.全線)
     int32 TotalPayLine = 2;                 // 總共多少賠付線(非全線讀SlotPayLine表，全線賠付為定值)
    repeated int32 BetCount = 3;                     // 一次下注的數量
    repeated int32 BigWinStep = 4;                   // BigWin各階段演出條件
     int32 RowCounts = 5;                    // 顯示結算的行數
    repeated TGW_ReelSetting ReelSetting = 6;        // 動態輪軸
    repeated TGW_SymbolPayTable SymbolPayTable = 7;  // 符號倍率設定
    repeated TGW_PayLine PayLines = 8;               // 所有賠線
     int64 MinCarryMoney = 9;                // 最小攜帶金額
     string PayLineDesc = 10;                // 派彩線說明文字
     string PickGameDesc = 11;               // 糖果遊戲說名字
    repeated TGW_UnitPrefix UnitPrefix = 12;        // 單位縮寫對照
};

// [訊息] 遊戲狀態 Server to Client -> TGW_StatusID = 10002
message TGW_MSG_Status {
     int32 State = 1;  // 狀態
}

// [訊息] Jackpot資訊 Server to Client -> TGW_JackpotPoolID = 10003
message TGW_MSG_JackpotPool {
    repeated int64 Money = 1;  // 水池金額
}

// [訊息] 下注結果 Server to Client -> TGW_BetStatusID = 10004
message TGW_MSG_BetStatus {
     int32 Ret = 1;  // 下注狀態 0: 下注成功, -1: 用戶金額不足, -2: 下注的類型未找到, -3: 莊家不能下注, -4: 此類下注已達到上限, -5: 非下注階段, -6: 用戶金額小於下注限制
     int64 Money = 2;  // 下注金額
}

// [訊息] 遊戲結果 (轉出內容，中獎項目，中獎金額) Server to Client -> TGW_GameResultID = 10005
message TGW_MSG_GameResult {
     int64 BetMoney = 1;             // 下注金額
     int64 WinMoney = 2;             // 贏得獎金
     int64 FinalMoney = 3;           // 最終身上金額
     int64 JackpotMoney = 4;         // 贏得的Jackpot金額
    repeated TGW_ReelResult ReelResult = 5;  // 輪軸結果
    repeated TGW_PayGroup PayGroups = 6;     // 中獎內容，賠付線結果(派彩線)
}

// [訊息] 玩家贏得 BonusGame 並取得BonusGame紀錄 Server to Client ->  TGW_BonusGameID = 10006
message TGW_MSG_BonusGame {
    repeated TGW_BonusGameRecord Records = 1;  // 目前開獎順序 [{ID:1, Location:8, RewareValue: 10}, {ID:2, Location:5, RewareValue: 20}, {ID:3, Location:6, RewareValue: 10}]
     int32 Count = 2;                  // 總共可翻次數，中獎進入BonusGame次數
     int64 WinMoney = 3;               // 中獎金額
    repeated int32 All = 4;                    // 所有選項內容共12比，包含Records內的資料 [10, 20, 10, 30, 10, 20, 10, 10, 20, 10, 10, 20]
}

// [訊息] 玩家Spin Client to Server -> TGW_ActionSpinID = 11001
message TGW_MSG_Spin {
     int64 Money = 1;  // 下注金額
}

// [訊息] 玩家選則BonusGame Client to Server -> TGW_ActionPickID = 12003
message TGW_MSG_Pick {
     TGW_BonusGameRecord Record = 1;  // 選擇內容
}

// [訊息] 玩家選則BonusGame Client to Server -> TGW_ActionPickRetID = 12004
message TGW_MSG_PickRet {
     TGW_BonusGameRecord Record = 1;  // 選擇內容
}

// [訊息] 玩家選則BonusGame Game to DB -> TGW_ReadBonusGameID = 13001
message TGW_MSG_ReadBonusGame {
     int32 UserID = 1;  // 玩家ID
}

// [訊息] 玩家選則BonusGame Game to DB -> TGW_ReadBonusGameRetID = 13002
message TGW_MSG_BonusGameRecord {
     int32 UserID = 1;                 // 玩家ID
    repeated TGW_BonusGameRecord Records = 2;  // 紀錄
}

// [訊息] 清除BonusGame資料 Game to DB -> TGW_ResetBonusGameID = 13003
message TGW_MSG_ResetBonusGame {
     int32 UserID = 1;  // 玩家ID
}

// [訊息] 紀錄BonusGame資料 Game to DB -> TGW_RecordBonusGameID = 13004
message TGW_MSG_RecordBonusGame {
     int32 UserID = 1;                 // 玩家ID
     TGW_BonusGameRecord Records = 2;  // 紀錄
}

// 輪軸表演設置
message TGW_ReelSetting {
     int32 RealID = 1;        // 輪軸編號
    repeated TGW_Symbol Symbols = 2;  // 該輪軸群組的符號
};

// 輪軸結果
message TGW_ReelResult {
     TGW_ReelPosition Position = 1;  // 輪軸位置
     TGW_Symbol Symbol = 2;          // 該輪軸群組的符號
     bool Blink = 3;                 // 是否亮符號
};

// 符號
message TGW_Symbol {
     int32 SymbolID = 1;     // 符號ID
     string SymbolName = 2;  // 符號Name
};

// 符號賠率設定
message TGW_SymbolPayTable {
     TGW_Symbol Symbol = 1;  // Symbol
     int32 Count = 2;        // 連續幾個Symbol
     string Type = 3;        // 獎項類型。 chip: 賠倍率, jackpot: 中jackpot, pickgame: 中bonus game
     int32 Payout = 4;       // 該項獎勵數量。 chip: 倍率, jackpot: 最大出獎金額, pickgame: 幾pick
     string Title = 5;       // 符號在賠付表要顯示的標題
     string Desc = 6;        // 符號在賠付表要顯示的說明
}

// 賠線資訊
message TGW_PayLine {
     int32 PayLineID = 1;             // 賠線ID
    repeated TGW_ReelPosition Positions = 2;  // 賠線位置 [{Reel: 1, Row: 2},{Reel: 2, Row: 2},{Reel: 3, Row: 2},{Reel: 4, Row: 2},{Reel: 5, Row: 2}]
}

// 位置資訊
message TGW_ReelPosition {
     int32 Reel = 1;  // 直的軸
     int32 Row = 2;   // 橫的列
}

// 中獎內容，賠付線結果(派彩線)
message TGW_PayGroup {
     TGW_PayLine PayLines = 1;  // 中獎的賠線     [{Reel:1,Row:2},{Reel:2,Row:2},{Reel:3,Row:2}] , 給多少畫多少線
     int64 WinMoney = 2;        // 這條連線中獎金額
}

// BonusGame 選擇位置紀錄 {ID: 1, Location: 0, Money: 100}
message TGW_BonusGameRecord {
     int32 ID = 1;           // 順序 1 開始，由小至大
     int32 Location = 2;     // 位置 0: 未翻過, [1-12]:位置
     int64 RewareValue = 3;  // 獎勵數量
     int32 BonusID = 4;      // 此次翻牌的BonusID
}

// 單位名稱
message TGW_UnitPrefix {
    optional string Name = 1;     // 單位名稱
    optional int64 Multiple = 2;  // 多少倍
}

// 讀取歷程紀錄
message TGW_LoadHistoryData {
     int32 UserID = 1;      // 玩家ID
     int32 GameID = 2;      // 遊戲ID
     string StartTime = 3;  // ServerID
     string EndTime = 4;    // 原始分數
     int32 PageIndex = 5;   // 第幾頁
     int32 PageSize = 6;    // 一頁幾筆
}

// 歷程紀錄結果
message TGW_SendHistoryData {
     int32 UserID = 1;                        // 回傳玩家ID
     int32 GameID = 2;                        // 回傳遊戲ID
     int32 PageCount = 3;                     // 回傳全部筆數
    repeated TGW_SendHistoryLog SendHistoryLog = 4;  //歷程紀錄
}

// 傳送歷程紀錄
message TGW_SendHistoryLog {
     int32 RowNum = 1;       //流水號
     string CreateTime = 2;  //訂單時間
     int64 OrderID = 3;      //訂單編號
     int64 BetMoney = 4;     //投注金額
     int64 Profit = 5;       //盈利/輸贏(計算方式:結算分數-原始分數)
}