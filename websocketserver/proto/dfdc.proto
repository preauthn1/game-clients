syntax = "proto3";

package dfdc;

//设置
message DFDC_Setting {
    repeated int32 BetCount = 1;                      //一次下注的数量
    repeated DFDC_ReelSetting ReelSetting = 2;        //動態輪軸
     int32 RowCounts = 3;                     //顯示結算的行數
     int32 TotalPayLine = 4;                  //總共多少賠付線(非全線讀SlotPayLine表，全線賠付為定值)
    repeated int32 BigWinStep = 5;                    // BigWin各階段演出條件
     int32 PayLineMode = 6;                   //賠付線類型 (0.非全線, 1.全線)
    repeated DFDC_SymbolPayTable SymbolPayTable = 7;  //符號倍率設定
    repeated Slot_UnitPrefix UnitPrefix = 8;          // 單位縮寫對照
};

//遊戲要付費或免費
message DFDC_FreeOrPayMsg {
     int32 FreeCount = 1;               //免費次數(0.付費)
    repeated DFDC_ReelSetting ReelSetting = 2;  //動態輪軸
};

//輪軸的圖片順序設置
message DFDC_ReelSetting {
     int32 RealID = 1;                  //輪軸編號
     int32 RowIndex = 2;                //行數
    repeated DFDC_SymbolGroup SymbolGroup = 3;  //該輪軸群組的符號
};

//該輪軸群組的符號
message DFDC_SymbolGroup {
     int32 SymbolID = 1;  //符號
     string SymbolName = 2;  //符號Name(client圖片使用) 符號類型(符號可組合，e.g. w1,w2,w3代表w1+w2+w3的組合，並以w1為主要辨識符號),s = scatter,w1~wN = wild (wj = 普通=> e.g. 女王 ; w2 =
                                     //特殊=> e.g. 法老),p1~pN 一般的符號,b1~bN bonus的符號
};

//游戏輪軸结果
message DFDC_GameResultReel {
    repeated int32 SymbolID = 1;                  //結果起始符號
    repeated DFDC_ReelSetting ReelSetting = 2;    //各輪軸資訊
    repeated DFDC_PayLineGroup PayLineGroup = 3;  //	賠付線
    repeated DFDC_PayAllGroup PayAllGroup = 4;    //	全線賠付內容
     int64 WinMoney = 5;                  //結算金額
     int64 FreeGameWinMoney = 6;          //免費遊戲總結算金額
};

//全線賠付內容
message DFDC_PayAllGroup {
    repeated DFDC_PayLineDetail PayLineDetail = 1;  //連線與得獎符號
    repeated DFDC_PayAllDetail PayAllDetail = 2;    //全線賠付細節
};

//全線賠付細節
message DFDC_PayAllDetail {
     string SymbolName = 1;   //符號名稱
     int32 PayRate = 2;       //該符號賠率
     int32 PayCount = 3;      //符號連線個數
     int32 WayCount = 4;      //符號連線總和
    repeated int32 SymbolIDList = 5;  //該連線符號ID列表
     bool FeaturePays = 6;    //是否觸發特殊事件(Jackpot、freeSpin)
};

//賠付線結果(派彩線)
message DFDC_PayLineGroup {
     int32 PayLineID = 1;                   //賠付線號碼
    repeated DFDC_PayLineDetail PayLineDetail = 2;  //連線與得獎符號
     int32 WinMoney = 3;                    //賠付線金額
};

//連線與得獎符號
message DFDC_PayLineDetail {
     int32 ReelID = 1;  //第幾個輪軸
     int32 SymbolID = 2;
     bool Blink = 3;       //是否亮符號	//開獎符號需亮
     bool Line = 4;        //是否畫線		//*
     int32 BetNumber = 5;  //是否乘倍數目		//*
     int64 BetMoney = 6;   //是否乘倍金額		//*
}

//遊戲狀態
message DFDC_GameStatus {
     int32 State = 1;  //状态
}

//下注金額
message DFDC_StartBet {
     int64 Money = 1;
     int32 GoldenSymbol = 2;
}

//下注回覆
message DFDC_BetRet {
     int32 Ret = 1;  // 0下注成功，-1用户金额不足，-2下注的类型未找到，-3庄家不能下注，-4此类下注已达到上限，-5非下注階段，-6用户金额小於下注限制
     int64 Money = 2;  //用户的下注金額
}

//查詢slot jackpot
message DFDC_GetJackpotMsg {
     int32 ServerID = 1;
     int32 FlagID = 2;
     int32 TableNo = 3;
     int32 JackpotID = 4;
}
//回傳slot jackpot
message DFDC_GetJackpotRet {
     int32 ServerID = 1;
     int32 FlagID = 2;
     int32 TableNo = 3;
     int32 JackpotID = 4;
     int64 SpinStack = 5;
     int64 PoolAmount = 6;
     int64 JPAmountOut = 7;
}

// S2C更新Jackpot值
message DFDC_JackpotPoolS2CMsg {
    repeated DFDC_JackpotPoolDetail JackpotPoolID = 1;
}
// Jackpot水池內容
message DFDC_JackpotPoolDetail {
     int32 JackpotID = 1;  // 1:巨獎 2:大獎 3:中獎 4:小獎
     int64 Syspool = 2;    // 水池值
     string Level = 3;     // 獎項名稱:Grand/Major/Minor/Mini
}

//多財多福黃金符號
message DFDC_GoldenSymbolList {
    repeated DFDC_GoldenSymbolDetail GoldenDetail = 1;
}

//多財多福黃金符號內容
message DFDC_GoldenSymbolDetail {
     int32 Symbols = 1;
     int32 Credits = 2;
}

//多財多福 Bonus Game
message DFDC_BonusGame {
    repeated DFDC_BonusGameDetail BonusDetail = 1;  //此組數為最終總共開幾組
     int64 Money = 2;                       // Bonus Game結果總金額
}

//多財多福 Bonus Game內容
message DFDC_BonusGameDetail {
     int32 Id = 1;     //流水號
     int32 Place = 2;  //在哪個位置(起始值1 未開啟0)
     int32 Icon = 3;   //圖片名稱
}

//多財多福 符號倍率設定
message DFDC_SymbolPayTable {
     string SymbolName = 1;  // Symbol圖片名稱
     int32 Count = 2;        //連續幾個Symbol
     int32 Rate = 3;         //該項Symbol倍率
}

//多財多福 讀取額外遊戲Detail
message DFDC_JackpotBonusGameDetail {
     int32 UserID = 1;  //玩家ID
     int32 TurnID = 2;  //順序ID
     int32 Place = 3;   //哪個位置
     int32 Icon = 4;    //圖片名稱
}

//多財多福 額外遊戲寫入
message DFDC_JackpotBonusGameRecord {
     int32 UserID = 1;         //玩家ID
     string chvRecordStr = 2;  // 9筆小遊戲內容 ("1,0,1|2,0,1|3,0,2|4,0,3|5,0,3|6,0,1|7,0,0|8,0,0|9,0,0")
     int64 winmoney = 3;       // jackpot贏錢
}

//多財多福 JackpotBonusGame
message DFDC_JackpotBonusGame {
    repeated DFDC_JackpotBonusGameDetail BonusDetail = 1;  //此組數為最終總共開幾組
     int64 Money = 2;                              // Bonus Game結果總金額
}

//多財多福 額外遊戲寫入
message DFDC_JackpotBonusGameRet {
     int32 UserID = 1;  //玩家ID
}

//多財多福 玩家殘餘資料
message DFDC_UserRecover {
     int64 WinMoey = 1;       //贏多少錢
     int64 BetMoney = 2;      //玩家下注金額
     int32 GoldenSymbol = 3;  //下注黃金符號
}

//多財多福 索取遊戲歷程
message DFDC_GetGameLog {
     string StartTime = 1;  //開始時間
     string EndTime = 2;    //結束時間
     int32 PageIndex = 3;   //第幾頁
     int32 PageSize = 4;    //一頁幾筆
}


message DFDC_MSG_UserEnter {
     Slot_GameUser User = 1;
}

message DFDC_MSG_UserLeave {
     Slot_GameUser User = 1;
}

message DFDC_MSG_UserStateChange {
     Slot_GameUser User = 1;
}

message Slot_GameUser {
     int32 UserID = 1;
     string NickName = 2;
     int32 Sex = 3;
     int32 FaceID = 4;
     int64 Score = 5;
     int32 WinCount = 6;
     int32 LoseCount = 7;
     int32 DrawCount = 8;
     int32 StateValue = 9;
     int32 TableNo = 10;
     int32 SeatNo = 11;
     int32 LastWinLose = 12;
     int64 Coupon = 13;
     int64 UpdateCoupon = 14;
     int32 AvatarFrameID = 15;
}

// 遊戲排列帶
message DFDC_MSG_ReelSetting {
    repeated Slot_GameReels GameReels = 1;  // 所有MainGameq排列帶
}

// [訊息] 設置相關 Server to Client -> Slot_SettingID = 20001
message DFDC_MSG_Setting {
     int32 PayLineMode = 1;                   // 賠付線類型 (0.非全線, 1.全線)
     int32 TotalPayLine = 2;                  // 總共多少賠付線
     int64 MinCarryMoney = 3;                 // 最小攜帶金額
     int32 RowCounts = 4;                     // 顯示結算的行數
    repeated int32 BetMoneys = 5;                     // 下注金額
    repeated int32 BetRates = 6;                      // 下注的倍率
    repeated int32 BigWinStep = 7;                    // BigWin各階段演出條件
    repeated Slot_SymbolPayTable SymbolPayTable = 8;  // 符號倍率設定
    repeated Slot_ReelSetting ReelSetting = 9;        // 輪軸表演設置
    repeated Slot_FreeGameInfo FreeGames = 10;        // 共有多少免費遊戲
    repeated Slot_PayLine PayLines = 11;              // 所有賠線
    repeated Slot_UnitPrefix UnitPrefix = 12;         // 單位縮寫對照
    repeated Slot_Description Descriptions = 13;      // 文字描述
    repeated Slot_GoldBallInfo GoldBallSetting = 14;  // 金球倍率設定
    repeated Slot_JackpotInfo Jackpots = 15;          // 多組奬池資訊
}

// [訊息] 遊戲狀態 Server to Client -> Slot_StatusID = 20002
message DFDC_MSG_Status {
     int32 State = 1;  // 遊戲狀態 0: 玩家可下注, 1: 開獎, 2: 開獎動畫, 3: 結算動畫, 4: 等待遊戲開始
}

// [訊息] 下注結果 Server to Client -> Slot_BetStatusID = 20003
message DFDC_MSG_BetStatus {
     int32 Ret = 1;  // 下注狀態 0: 下注成功, -1: 用戶金額不足, -2: 下注的類型未找到, -3: 莊家不能下注, -4: 此類下注已達到上限, -5: 非下注階段, -6: 用戶金額小於下注限制
     int64 Money = 2;  // 下注金額
}

// [訊息] 遊戲結果 (轉出內容，中獎項目，中獎金額) Server to Client -> Slot_GameResultID = 20004
message DFDC_MSG_GameResult {
     int64 BetMoney = 1;                          // 下注金額
     int64 WinMoney = 2;                          // 贏得獎金
     int64 FinalMoney = 3;                        // 最終身上金額
     int64 JackpotMoney = 4;                      // 贏得的Jackpot金額
    repeated Slot_ReelResult ReelResult = 5;              // 輪軸結果
    repeated Slot_PayGroup PayGroups = 6;                 // 中獎內容，賠付線結果(派彩線)
     int64 FreeGameWinMoney = 7;                  // 免費遊戲累計所贏得的獎金
     Slot_FreeGameExtAward FreeGameExtAward = 8;  // 免費遊戲額外獎勵
     Slot_BackgroundInfo BackgroundInfo = 9;      // 背景結果
}

// [訊息] 剩餘免費遊戲資訊 Server to Client -> Slot_LeftFreeGameID = 20005
message DFDC_MSG_LeftFreeGameData {
     int32 Count = 1;                             // 剩餘次數
     int64 BetMoney = 2;                          // 下注金額
     int64 BetRate = 3;                           // 下注倍率符號
     int32 ID = 4;                                // 免費遊戲ID
     Slot_FreeGameExtAward FreeGameExtAward = 5;  // 免費遊戲額外獎勵
}

// [訊息] 玩家Spin Client to Server -> Slot_ActionSpinID = 21001
message DFDC_MSG_Spin {
     int64 Money = 1;  // 下注金額
     int32 Rate = 2;   // 下注倍率
}

// [訊息] Jackpot奬池資訊 Client to Server -> Slot_JackpotPoolID = 22003
message DFDC_MSG_GetJackpot {
    repeated int32 ID = 1;  // 多組奬池ID
}

// [訊息] Jackpot奬池資訊 Server to Client -> Slot_JackpotPoolRetID = 22004
message DFDC_MSG_JackpotPool {
    repeated Slot_JackpotInfo Jackpots = 1;  // 多組奬池資訊
}

// [訊息] 查詢遊戲歷程 Client to Server -> Slot_LoadHistoryID = 22001 || Server to DB -> Slot_GameLogReadID = 30031
message DFDC_MSG_GameLogRead {
     int32 UserID = 1;      // 玩家ID
     int32 GameID = 2;      // 遊戲ID
     string StartTime = 3;  // 起始時間
     string EndTime = 4;    // 結束時間
     int32 PageIndex = 5;   // 第幾頁
     int32 PageSize = 6;    // 一頁幾筆
}

// [訊息] 回傳遊戲歷程 || 新增遊戲歷程 Server to Client -> Slot_LoadHistoryRetID = 22002 || Server to DB -> Slot_GameLogReadRetID = 30032
message DFDC_MSG_GameLogRecord {
     int32 UserID = 1;       // 回傳玩家ID
     int32 GameID = 2;       // 回傳遊戲ID
     int32 PageCount = 3;    // 回傳全部筆數
    repeated Slot_GameLog Logs = 4;  // 歷程紀錄
}

// [訊息] Lightning準備資訊 Server to Client -> XMBX_LightningPrepareID = 11001
message DFDC_MSG_LightningPrepare {
     int32 LightningStep = 1;                 // 第N次Lightning
    repeated Slot_ReelSetting ReelSetting = 2;        // 動態輪軸
    repeated Slot_LightningLock LockSymbols = 3;      // 輪軸鎖格子
     int32 Count = 4;                         // 剩餘次數
     bool IsFreeGame = 5;                     // 是否免費遊戲贏得
    repeated Slot_ReelResult ReelResult = 6;          // 輪軸結果
    repeated Slot_LightningPayout PastPayGroups = 7;  // 過去的中獎內容，賠付線結果(派彩線)
     int64 BetMoney = 8;                      // 下注金額
     int64 BetRate = 9;                       // 下注倍率
}

// [訊息] Lightning結果 Server to Client -> XMBX_LightningResultID = 11002
message DFDC_MSG_LightningResult {
     int64 BetMoney = 1;                  // 下注金額
     int64 WinMoney = 2;                  // 贏得獎金
     int64 FinalMoney = 3;                // 最終身上金額
     int64 JackpotMoney = 4;              // 贏得的Jackpot金額
    repeated Slot_ReelResult ReelResult = 5;      // 輪軸結果
    repeated Slot_LightningPayout PayGroups = 6;  // 中獎內容，賠付線結果(派彩線)
     int64 FreeGameWinMoney = 7;          // 免費遊戲累計所贏得的獎金
     int32 LightningStep = 8;             // 第N次Lightning
     int32 Count = 9;                     // 剩餘次數
}

// [訊息] Lightning階段表演完成 Client to Server -> XMBX_ActionLightningSpinID = 11001
message DFDC_MSG_LightningShow {
     int32 LightningStep = 1;  // 第N次Lightning
}

// [訊息] 遊戲結果 (轉出內容，中獎項目，中獎金額) Server to Client -> Slot_GameResultID = 20004
message DFDC_MSG_StepGameResult {
     int64 BetMoney = 1;                  // 下注金額
     int64 WinMoney = 2;                  // 贏得獎金
     int64 FinalMoney = 3;                // 最終身上金額
    repeated Slot_StepGameResult SlotResult = 4;  // 輪軸結果
}

// [訊息] 玩家贏得 BonusGame 並取得BonusGame紀錄 Server to Client ->  Slot_BonusGameID = 20009
message DFDC_MSG_BonusGame {
    repeated Slot_BonusGameRecord Records = 1;  // 目前開獎順序 [{ID:1, Location:8, RewareValue: 10}, {ID:2, Location:5, RewareValue: 20}, {ID:3, Location:6, RewareValue: 10}]
     int32 Count = 2;                   // 總共可翻次數，中獎進入BonusGame次數
     int64 WinMoney = 3;                // 中獎金額
    repeated int32 All = 4;                     // 所有選項內容共12比，包含Records內的資料 [10, 20, 10, 30, 10, 20, 10, 10, 20, 10, 10, 20]
     int64 BetMoney = 5;                // 下注金額
     int64 BetRate = 6;                 // 下注倍率
}

// [訊息] 玩家選則BonusGame Client to Server -> Slot_PickBonusID = 22005, Server to Client -> Slot_PickBonusRetID = 22006
message DFDC_MSG_PickBonus {
     Slot_BonusGameRecord Record = 1;  // 選擇內容
}

// [訊息] 玩家選擇哪種免費遊戲 Server to Client -> Slot_ChooseGameID = 11001
message DFDC_MSG_ChooseGame {
     Slot_ChooseGameOption Option = 1;  // 選項
}

// [訊息] 通知可以選擇龍龍 Server to Client -> Slot_GameOptionsID = 10001
message DFDC_MSG_ChooseGameOptions {
     int32 Times = 1;                    // 選擇免費遊戲的剩餘次數
    repeated Slot_ChooseGameOption Options = 2;  // 選項
     string Data = 3;                    // JSON string
    repeated Slot_ReelResult ReelResult = 4;     // 輪軸結果
     int64 BetMoney = 5;                 // 下注金額
     int64 BetRate = 6;                  // 下注倍率
}

// [訊息] 通知可以增加遊戲有次數的東西 Server to Client -> Slot_IncreaseGameTimesID = 20011;       // 遊戲次數增加封包 可為[FreeGame], [JackpotGame]
message DFDC_MSG_IncreaseGameTimes {
     string Type = 1;  // 增加的種類
     int32 Count = 2;  // 增加次數
     int32 ID = 3;
     string Data = 4;
}

// 選擇遊戲的選項
message Slot_ChooseGameOption {
     int32 ID = 1;     // 對應ID
     string Type = 2;  // 遊戲類型
     string Data = 3;  // 附加資訊
}

// 輪軸表演設置
message Slot_ReelSetting {
     int32 ReelID = 1;         // 輪軸編號
    repeated Slot_Symbol Symbols = 2;  // 該輪軸群組的符號
}

// 位置資訊
message Slot_ReelPosition {
     int32 Reel = 1;  // 直的軸
     int32 Row = 2;   // 橫的列
}

// 輪軸結果
message Slot_ReelResult {
     Slot_ReelPosition Position = 1;  // 輪軸位置
     Slot_Symbol Symbol = 2;          // 該輪軸群組的符號
     bool Blink = 3;                  // 是否亮符號
     int64 Multi = 4;                 // 符號倍率
}

// 輪軸背景結果
message Slot_BackgroundInfo {
    repeated Slot_BackgroundUnit Result = 1;        // 輪軸位置
     int64 WinMoney = 2;                    // 背景獎勵金額
    repeated Slot_ReelPosition BlinkPositions = 3;  // 亮符號位置
}

// 輪軸背景結果
message Slot_BackgroundUnit {
     Slot_ReelPosition Position = 1;  // 輪軸位置
     string Type = 2;                 // 背景顏色
}

// 符號
message Slot_Symbol {
     int32 SymbolID = 1;              // 符號ID
     string SymbolName = 2;           // 符號Name
     Slot_ReelPosition Position = 3;  // 輪軸位置
}

// 賠線資訊
message Slot_PayLine {
     int32 PayLineID = 1;              // 賠線ID
    repeated Slot_ReelPosition Positions = 2;  // 賠線位置 [{Reel: 1, Row: 2},{Reel: 2, Row: 2},{Reel: 3, Row: 2},{Reel: 4, Row: 2},{Reel: 5, Row: 2}]
}

// 中獎內容，賠付線結果(派彩線)
message Slot_PayGroup {
     Slot_PayLine PayLines = 1;             // 中獎的賠線     [{Reel:1,Row:2},{Reel:2,Row:2},{Reel:3,Row:2}] , 給多少畫多少線
     int64 WinMoney = 2;                    // 這條連線中獎金額
     string LinkType = 3;                   // 連線方式. left: 由左至右連線，right: 由右至左連線
     int32 Count = 4;                       // 連線符號數量
    repeated Slot_ReelPosition BlinkPositions = 5;  // 亮符號位置
     int32 Way = 6;                         // 共有幾條連線
     int32 Multi = 7;                       // 加乘倍數
}

// 符號賠率設定
message Slot_SymbolPayTable {
     Slot_Symbol Symbol = 1;  // Symbol
     int32 Count = 2;         // 連續幾個Symbol
     string Type = 3;         // 獎項類型。 chip: 賠倍率, jackpot: 中jackpot, pickgame: 中bonus game
     int32 Payout = 4;        // 該項獎勵數量。 chip: 倍率, jackpot: 最大出獎金額, pickgame: 幾pick
     string Title = 5;        // 符號在賠付表要顯示的標題
     string Desc = 6;         // 符號在賠付表要顯示的說明
}

// 寫入歷程紀錄
message Slot_HistoryLogData {
     int32 UserID = 1;          // 玩家ID
     int32 GameID = 2;          // 遊戲ID
     int32 ServerID = 3;        // ServerID
     int64 CurrentAmount = 4;   // 原始分數
     int64 BetMoney = 5;        // 押分
     int64 WinMoney = 6;        // 贏分
     int64 FinalScore = 7;      // 結算分數
     int32 GameType = 8;        // 遊戲形式
     int32 LogType = 9;         // 牌型紀錄種類
     string GameData = 10;      // 牌型紀錄
     int64 CurrentCoupon = 11;  // 原始Coupon
     int64 BetCoupon = 12;      // 押Coupon
     int64 FinalCoupon = 13;    // 結算Coupon
}

// 讀取歷程紀錄
message Slot_LoadHistoryData {
     int32 UserID = 1;      // 玩家ID
     int32 GameID = 2;      // 遊戲ID
     string StartTime = 3;  // ServerID
     string EndTime = 4;    // 原始分數
     int32 PageIndex = 5;   // 第幾頁
     int32 PageSize = 6;    // 一頁幾筆
}

// 歷程紀錄結果
message Slot_SendHistoryData {
     int32 UserID = 1;                        // 回傳玩家ID
     int32 GameID = 2;                        // 回傳遊戲ID
     int32 PageCount = 3;                     // 回傳全部筆數
    repeated Slot_SendHistoryLog SendHistoryLog = 4;  //歷程紀錄
}

// 傳送歷程紀錄
message Slot_SendHistoryLog {
     int32 RowNum = 1;       //流水號
     string CreateTime = 2;  //訂單時間
     int64 OrderID = 3;      //訂單編號
     int64 BetMoney = 4;     //投注金額
     int64 Profit = 5;       //盈利/輸贏(計算方式:結算分數-原始分數)
}

// 歷程紀錄
message Slot_GameLog {
     int32 RowNum = 1;       // 流水號
     string CreateTime = 2;  // 訂單時間
     int64 OrderID = 3;      // 訂單編號
     int64 BetMoney = 4;     // 投注金額
     int64 Profit = 5;       // 盈利/輸贏(計算方式:結算分數-原始分數)
}

// 免費遊戲
message Slot_FreeGameInfo {
     int32 ID = 1;                      // 免費遊戲ID
     int32 Count = 2;                   // 總共可以有多少次
    repeated Slot_ReelSetting ReelSetting = 3;  // 動態輪軸
     string Data = 4;                   // 額外資訊 JSON
}

// Jackpot奬池資訊
message Slot_JackpotInfo {
     int64 Money = 1;  // Jackpot最大獎金額
     string Name = 2;  // Jackpot名稱 (Single / Grand / Major / Minor / Mini)
     int32 ID = 3;     // JackpotID
     bool IsLink = 4;  // 是否為連線水池
}

// 單位名稱
message Slot_UnitPrefix {
     string Name = 1;     // 單位名稱
     int64 Multiple = 2;  // 多少倍
}

// 文字敘述
message Slot_Description {
     string Name = 1;   // Key
     string Desc = 2;   // Value
     string Title = 3;  // Value
}

// 金球倍率設定
message Slot_GoldBallInfo {
     string Symbol = 1;             // 符號
     string Type = 2;               // 獎勵類型
     int64 Value = 3;               // 獎勵內容, Jackpot: 給ID, Multiple: 給倍數
    repeated string AccumulateSymbols = 4;  // Type: Accumulate
}

// Lightning 賠付資訊
message Slot_LightningPayout {
     string Type = 1;                 // 獎項類型. chip: 賠倍率, chipXrate: 賠倍率, jackpot: 中jackpot
     int64 WinMoney = 2;              // 贏得金額
     Slot_ReelPosition Position = 3;  // 中獎位置
     string JackpotType = 4;          // jackpot類型
     int32 SymbolID = 5;              // SymbolID
}

// Lightning 鎖軸資訊
message Slot_LightningLock {
     int32 SymbolID = 1;              // 輪軸編號
     Slot_ReelPosition Position = 2;  // 輪軸鎖格子
}

// 阿拉丁遊戲結果 會附帶一組第一次轉完畫面，與拓展後畫面加結算，
message Slot_StepGameResult {
    repeated Slot_ReelResult InitResult = 1;      // 第一次轉完畫面
     bool IsRespin = 2;                   // 是否為重轉
     bool IsExpand = 3;                   // 是否表演拓展
    repeated int32 ExpandReel = 4;                // 若有拓展，是第幾軸
     string ExpandOrder = 5;              // 若有拓展，順序為 ASC: 上到下，DESC: 下到上
     DFDC_MSG_GameResult SlotResult = 6;  // 拓展後畫面與結算
}

// BonusGame 選擇位置紀錄 {ID: 1, Location: 0, Money: 100}
message Slot_BonusGameRecord {
     int32 ID = 1;           // 順序 1 開始，由小至大
     int32 Location = 2;     // 位置 0: 未翻過, [1-12]:位置
     int64 RewareValue = 3;  // 獎勵數量
     int32 BonusID = 4;      // 此次翻牌的BonusID
}

// 免費遊戲額外獎勵
message Slot_FreeGameExtAward {
     int32 TotalCount = 1;      // 累計贏取次數
     int64 TotalWinMoney = 2;   // 累計贏取金額
     int32 Count = 3;           // 本次贏取次數
     int64 WinMoney = 4;        // 本次贏取金額
     int64 EachCountMoney = 5;  // 單次金額
     bool IsFinished = 6;       // 獎勵是否結算
    repeated Slot_Symbol Symbols = 7;   // 獎勵符號
}

// 排列帶資訊
message Slot_GameReels {
     string Name = 1;                   // 排列帶名稱
     int32 ID = 2;                      // MainGameID
    repeated Slot_ReelSetting ReelSetting = 3;  // 輪軸表演設置
     string ConditionType = 4;          // 情境條件
     string ConditionValue = 5;         // 情境條件對應值
}