syntax = "proto3";

package brnn;

//下注设置
message BRNN_Setting {
    repeated int32 BetCount = 1;     // 一次下注的数量
     int32 BetMoney = 2;     // 一次下注的钱
     int64 ZhuangLimit = 3;  // 上庄钱限制
     int32 MaxZhuang = 4;    // 当庄局数
     int32 OnceFapei = 5;    // true一次開獎結果 或 false分次發牌開獎
     int64 betlimitmoney=6;//下注攜帶金額限制
};

//状态消息
message BRNN_Sate {
     int32 State = 1;   // 状态
     int32 Time = 2;    // 此状态的剩余时间
     bool IsScene = 3;  // 是否來自場景
};

//用户断线重连下注消息
message BRNN_UserBetInfo {
     int64 UserMoney = 1;
    repeated BRNN_BroadCastBet BetInfo = 2;
};

//廣播發牌給所有(莊*1 , 閒*4)
message BRNN_BrodcastPokerCard {
    repeated BRNN_BrodcastUserPokerCard UserPokerCard = 1;
}

//每個座位上的亮牌
message BRNN_BrodcastUserPokerCard {
     int32 SitNo = 1;
    repeated PokerCard CardGroup = 2;
}

//广播用户下注的数组, 廣播下注消息
message BRNN_BroadCastBetArr {
     int32 UserID = 1;
    repeated BRNN_BroadCastBet BroadCastBetArr = 2;
};

//广播用户下注内容数据结构
message BRNN_BroadCastBet {
     int32 Type = 1;
     int64 Money = 2;
     int32 UserID = 3;  //此下注籌碼的UserID
     bool LuckyStar = 4;
};

//廣播已下注和還可下注
message BRNN_BroadCastTotal {
     int64 AlreadyTotalBet = 1;  //已下注
     int64 AbleTotalBet = 2;     //還可下注
}

//用户下注数组, 用户下注
message BRNN_BetArr {
    repeated BRNN_Bet BetArr = 1;
};

//用户下注数据结构
message BRNN_Bet {
     int32 BetType = 1;
     int32 Count = 2;
};

//下注的结果
message BRNN_BetRet {
     RetType Ret = 1 ;//[default = UNKNOWN];
     int64 Money = 2;      //用户的钱，下注以后的金额。
     int32 Type = 3;       //下注超过限制的下注类型
    repeated BRNN_Bet BetArr = 4;  //用户下注数据
}

enum RetType {
    UNKNOWN = 0;
    SUCCESS = 1;         //下注成功
    NOMONEY = 2;         //用户金额不足
    NONTYPE = 3;         //下注的类型未找到
    ISZHUANG = 4;        //庄家不能下注
    BETOUTOFRANGE = 5;   //此类下注已达到上限
    MONEYLESSLIMIT = 6;  //用戶金幣低於最低限制
}

//游戏撲克结果
message BRNN_GameResultPoker {
     int32 SitNo = 1;         //座位的編號
    repeated PokerCard SitPoker = 2;  //座位上的撲克牌
     int32 NiuNiuRet = 3;     //牛牛類型: 0 五小牛; 1四炸; 2 五花牛; 3 牛牛; 4 有牛; 5 無牛;
     int32 NiuNiuNumber = 4;  //牛幾
     int32 WinLoss = 5;       // 0 輸 , 1 贏
};

//游戏用户赢钱结果
message BRNN_GameResultUserMoney {
     int64 ZhuangWin = 1;
     int64 SelfWin = 2;
    repeated BRNN_WinUerInfo WinUserInfo = 3;     //赢钱前三名的人信息
    repeated BRNN_StageUerInfo StageUerInfo = 4;  //標誌玩家赢钱信息
};
//赢钱玩家信息
message BRNN_WinUerInfo {
     string UserName = 1;
     int64 Win = 2;
};

//上庄结果
message BRNN_ShangzhuangRet {
     int32 ret = 1;  //值为1时下庄成功，值为0表示上庄成功，值为-1时上庄失败资金不足，值为-2时已经在上庄列表中。
};

//是否上庄
message BRNN_ShangZhuang {
     bool IsShangZhuang = 1;
};

//庄家信息
message BRNN_ZhuangInfo {
     int32 UserID = 1;
     int32 LastTurn = 2;
    repeated GameUser UserInfo = 3;
};

//上庄列表
message BRNN_ZhuangList {
    repeated GameUser UserInfo = 1;
};

//清除结果回应消息
message BRNN_BetClearRet {
     int64 Money = 1;  //当前的钱
     int32 Ret = 2;    //清除结果-1，清理失败，达到清理上限，0清理成功
};

//大富豪列表消息
message BRNN_RichestList {
    repeated BRNN_Richest RichestList = 1;  //富豪的排行榜
};

//大富豪的玩家資訊
message BRNN_Richest {
     int32 Ranking = 1;        //富豪排名
     int32 UserID = 2;         //富豪ID
     int32 UserFaceID = 3;     //富豪頭像ID
     int64 Money = 4;          //富豪当前身上的钱
     int32 AvatarFrameID = 5;  // VIP頭框像ID
};

//幸運星玩家資訊
message BRNN_LuckyStar {
     int32 UserID = 1;         //幸運星ID
     int32 UserFaceID = 2;     //幸運星頭像ID
     int32 AvatarFrameID = 3;  // VIP頭框像ID
};

//標誌玩家赢钱信息
message BRNN_StageUerInfo {
     int32 UserID = 1;
     int64 Win = 2;
};


message TestGameChat {
     string Message = 1;
};

message TestGameScore {
     int32 Score = 1;
};

message TestGameEnd {};

message UserEnter {
     GameUser User = 1;
};

message UserLeave {
     GameUser User = 1;
};

message UserStateChange {
     GameUser User = 1;
};

message GameUser {
     int32 UserID = 1;
     string NickName = 2;
     int32 Sex = 3;
     int32 FaceID = 4;
     int64 Score = 5;
     int32 WinCount = 6;
     int32 LoseCount = 7;
     int32 DrawCount = 8;
     int32 StateValue = 9;
     int32 TableNo = 10;
     int32 SeatNo = 11;
     int32 LastWinLose = 12;
};

message GamePoker {
    repeated UserPoker Poker = 1;
};

message UserPoker {
     int32 UserID = 1;
     int32 SeatNo = 2;
    repeated PokerCard Cards = 3;
};

message PokerCard {
     int32 Color = 1;
     int32 CardNumber = 2;
};
message UserActionCommited {
     string ActionName = 1;
};
message AllUserActionCommited {
     string ActionName = 1;
};
message LookOnUserNotify {
    repeated int32 UserID = 1;
};
message UserLuckScore {
     int32 UserID = 1;
     int64 Score = 2;
};
message UserLuckScoreRet {
     int32 UserID = 1;
     string Value = 2;
};

message GameBeginCountDown {
     int32 Time = 1;
};

message SuperToolAddChangeLog {
     int32 GameID = 1;
     int32 TableNo = 3;
     int32 Type = 4;
     string Result = 5;
     string Operator = 6;
}

message SuperToolAddAssignReward {
     int32 GameID = 1;
     int32 FlagID = 2;
     int32 TableNo = 3;
     string Result = 4;
     string Operator = 5;
    repeated SuperToolAddAssignRewardDetail DetailList = 6;
}

message SuperToolGetAssignRewardDetail {
     int32 GameID = 1;
     int32 FlagID = 2;
     int32 TableNo = 3;
}

message SuperToolAddAssignRewardDetail {
     int32 Idx = 1;
     string Description = 2;
     string Reward = 3;
     int32 Status = 4;
}

message SuperToolAssignRewardDetail {
     int32 LogID = 1;
     int32 Idx = 2;
     string Description = 3;
     string Reward = 4;
     int32 Status = 5;
}

message SuperToolGetVipUserRequest {
     int32 GameID = 1;
}

message SuperToolVipUserDataList {
    repeated SuperToolVipUserData DataList = 1;
}

message SuperToolVipUserData {
     int32 UserID = 1;
     int64 AssignAmount = 2;
     int32 AssignRate = 3;
     int64 CompleteAmount = 4;
     int32 Complete = 5;
     int32 Status = 6;
     int32 TotalAll = 7;
     int32 TotalUserWinLose = 8;
     int32 TodayUserWinLose = 9;
}

message SuperToolFishGetSystemRewardDetail {
    repeated FishSystemRewardDataList FishRewardList = 1;
}

message FishSystemRewardDataList {
     int32 FishID = 1;
     int64 Amount = 2;
     int64 FinishAmount = 3;
     int32 Rate = 4;
     int32 Status = 5;
}

message SuperToolFishGetVIPUserRewardDetail {
    repeated FishVIPUserRewardDataList FishVIPUserList = 1;
}

message FishVIPUserRewardDataList {
     int32 UserID = 1;
     int64 AssignAmount = 2;
     int32 Rate = 3;
     int64 FinishAmount = 4;
     int32 Status = 5;
     int64 SumAssignAmount = 6;
}

message SuperToolFishUpdSystemRewardDetail {
     int32 FlagID = 1;
    repeated SuperToolFishUpdSystemRewardDataList FishRewardList = 2;
}

message SuperToolFishUpdSystemRewardDataList {
     int32 FishID = 1;
     int64 FinishAmount = 2;
}

message SuperToolfishUpdVIPUserRewardDetail {
     int32 GameID = 1;
    repeated SuperToolFishUpdVIPUserRewardDataList FishUserRewardList = 2;
}

message SuperToolFishUpdVIPUserRewardDataList {
     int32 UserID = 1;
     int64 FinishAmount = 2;
}

message SuperToolZjhVipUserDataList {
    repeated SuperToolZjhVipUserData DataList = 1;
}

message SuperToolZjhVipUserData {
     int32 UserID = 1;
     int64 NextType = 2;
     int64 NextWinLose = 3;
     int64 NextWinLoseNum = 4;
     int64 Finish = 5;
     int64 FinishNextWinLoseNum = 6;
     int32 NextTable = 7;
     int32 Status = 8;
     int64 TodaySumcharge = 9;
     int64 TodaySumConvert = 10;
     int64 TodayUserWinLose = 11;
}

message SuperToolZjhUpdVipUserData {
     int32 UserID = 1;
     int64 Finish = 2;
     int64 FinishNextWinLoseNum = 3;
     int32 NextTable = 4;
     int64 NextType = 5;
}

message FishSysPoolData {
     int32 FlagID = 1;
     int64 SumBetMoney = 2;
     int64 SumBullet = 3;
     int64 SysSumWinLoss = 4;
     int64 AfterAdjustSyspoolWinLoss = 5;  //系統水池贏錢抽水後水池
     int64 PoolAmount = 6;                 //調控水池
}

message FishPlayerPoolDetail {
     int32 FlagID = 1;
    repeated FishPlayerPoolDetailList FishRewardList = 2;
}

message FishPlayerPoolDetailList {
     int32 UserID = 1;
     int64 HitMoney = 2;
     int64 SpendMoney = 3;
}

message FindFishBeginnerOfferByUserID {
     int32 UserID = 1;
     int32 NewPlayerAdjustSyspool = 2;
}

message FishBeginnerOfferDetail {
    repeated FishBeginnerOffer NewPlayerList = 1;
     int32 NewPlayerAdjustSyspool = 2;
}

message FishBeginnerOffer {
     int32 UserID = 1;
     int32 Bullet = 2;
     int32 Score = 3;
     int32 Status = 4;
}

message Cd21SysPoolData {
     int32 FlagID = 1;
     int64 SumBetMoney = 2;
     int64 SumBetCount = 3;
     int64 PoolAmount = 4;
}

message UserJackpotToBox {
     int32 UserID = 1;
     int64 UpdateAmount = 2;
}

// jackpot資料
message JackpotData {
     int32 GameID = 1;             // GameID
     int32 FlagID = 2;             // FlagID
     int32 TableNo = 3;            // 桌子編號
     int64 Contribution = 4;       // 玩家貢獻值
     int64 TotalContribution = 5;  // 總貢獻值
     int64 AwardTotal = 6;         // 已發送獎金總和
     int32 Level = 7;              // Jackpot層級
     int64 JackpotPool = 8;        // 彩金池
}

// jackpot資料
message JackpotAllData {
    repeated JackpotData AllData = 1;  // 各池異動值
}

// 要求 水線控制遊戲輸贏結果
message SuperTool_Msg_GetSysPoolWinLose {
     int32 GameID = 1;          // 遊戲編號
     int32 FlagID = 2;          // 房間編號
};

// 回傳 水線控制遊戲輸贏結果
message SuperTool_Msg_GetSysPoolWinLoseRet {
     int32 GameID = 1;          // 遊戲編號
     int32 FlagID = 2;          // 房間編號
     int64 PoolAmount = 3;      // 水線
     int64 WinLine = 4;         // 贏錢線
	 string WinLoseData = 5;    // 遊戲輸贏結果
};

// 更新 水線控制遊戲輸贏結果
message SuperTool_Msg_UpdateSysPoolWinLose {
     int32 GameID = 1;          // 遊戲編號
     int32 FlagID = 2;          // 房間編號
     int64 PoolAmount = 3;      // 水線
     int64 WinLine = 4;         // 贏錢線
	 string WinLoseData = 5;    // 遊戲輸贏結果
};

